[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ion-source-simulations"
version = "0.1.0"
description = "Physics simulation of ion source behavior with hot surface ion sources for radioactive ion beam generation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Stu-Pid1"}
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "plotly>=5.0.0",
    "numba>=0.56.0",
    "tqdm>=4.62.0",
]

[project.optional-dependencies]
gpu = [
    "cupy>=10.0.0",
]
distributed = [
    "dask[array]>=2022.1.0",
    "mpi4py>=3.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100
